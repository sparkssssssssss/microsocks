name: Build Microsocks (Apt GCC Method)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout workspace
      uses: actions/checkout@v4

    - name: Install GCC for MIPS
      run: |
        # 直接从 Ubuntu 官方源安装，速度极快
        sudo apt-get update
        sudo apt-get install -y gcc-mipsel-linux-gnu

    - name: Clone Microsocks
      run: git clone https://github.com/rofl0r/microsocks.git

    - name: Compile
      run: |
        cd microsocks
        
        # 使用系统安装的交叉编译器
        # 注意：这里虽然工具链叫 linux-gnu，但加上 -static 后不依赖动态库，
        # 可以在 OpenWrt (musl) 上运行。
        
        make CC="mipsel-linux-gnu-gcc -static -O3" \
             LDFLAGS="-static -s"

        mv microsocks ../microsocks-mt7621-static

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: microsocks-mt7621-static
        path: microsocks-mt7621-static
