name: Build microsocks for MT7621 (static)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils file

      - name: Download musl cross toolchain (mipsel)
        run: |
          wget -q https://musl.cc/mipsel-linux-musl-cross.tgz
          tar -xzf mipsel-linux-musl-cross.tgz
          echo "${GITHUB_WORKSPACE}/mipsel-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Build static binary for MT7621
        run: |
          mipsel-linux-musl-gcc -v
          make clean || true
          make \
            CC=mipsel-linux-musl-gcc \
            CFLAGS="-Os -pipe -static -s -march=mips32r2 -mtune=1004kc -msoft-float" \
            LDFLAGS="-static"

          file microsocks
          # 再次确保 strip（有些 Makefile 已经做过）
          mipsel-linux-musl-strip microsocks || true

      - name: Rename artifact
        run: |
          mkdir -p out
          cp microsocks out/microsocks-mt7621-mipsel-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsocks-mt7621-mipsel-static
          path: out/microsocks-mt7621-mipsel-static
